name: Office Kit CI
on:
  push:
    branches: [main, docs/canonical-product-contract]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core-tests:
    name: core-tests (${{ matrix.os }} / Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22, "26.13.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Validate core syntax and run tests
        run: npm run check
      - name: Validate example configuration JSON
        run: node -e "JSON.parse(require('node:fs').readFileSync('examples/minimal-office.json', 'utf8'))"
      - name: Build all isolated edition source packages
        run: npm run build:all-editions
      - name: Validate Windows PowerShell scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $scripts = @(
            "tools/windows/build-host-bundle.ps1",
            "tools/windows/test-host-bundle.ps1"
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $script),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.ToString() }
            }
          }
      - name: Set up .NET SDK for native Windows keystore
        if: runner.os == 'Windows'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish Windows CNG host
        if: runner.os == 'Windows'
        run: dotnet publish native/windows/OfficeKit.CngHost/OfficeKit.CngHost.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/windows-cng
      - name: Exercise real Windows CNG persistence and isolation
        if: runner.os == 'Windows'
        env:
          OFFICE_KIT_CNG_HOST_PATH: ${{ github.workspace }}\artifacts\windows-cng\OfficeKit.CngHost.exe
        run: node --test packages/scene-engine/test/windows-cng-p256-keystore.integration.test.mjs
      - name: Exercise Windows CNG DGM bootstrap secret vault
        if: runner.os == 'Windows'
        env:
          OFFICE_KIT_CNG_HOST_PATH: ${{ github.workspace }}\artifacts\windows-cng\OfficeKit.CngHost.exe
        run: node --test packages/windows-host/test/secret-vault.integration.test.mjs
      - name: Exercise CNG-protected incident journal across host restarts
        if: runner.os == 'Windows'
        env:
          OFFICE_KIT_CNG_HOST_PATH: ${{ github.workspace }}\artifacts\windows-cng\OfficeKit.CngHost.exe
        run: node --test packages/windows-host/test/incident-journal-cng.integration.test.mjs
      - name: Exercise persistent Windows node identity runtime
        if: runner.os == 'Windows'
        env:
          OFFICE_KIT_CNG_HOST_PATH: ${{ github.workspace }}/artifacts/windows-cng/OfficeKit.CngHost.exe
        run: node --test packages/scene-engine/test/windows-node-identity-runtime.integration.test.mjs
      - name: Build portable Windows host bundle
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          OFFICE_KIT_CNG_HOST_PATH: ${{ github.workspace }}\artifacts\windows-cng\OfficeKit.CngHost.exe
        run: ./tools/windows/build-host-bundle.ps1 -OutputDirectory artifacts/windows-host-bundle
      - name: Exercise portable Windows host bundle end to end
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/windows/test-host-bundle.ps1 -BundleDirectory artifacts/windows-host-bundle
