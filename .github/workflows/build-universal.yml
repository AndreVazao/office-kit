name: Build — Office Kit Universal
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: office-kit-build-universal
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26.13.1"
      - name: Validate shared core and tests
        run: npm run check
      - name: Build Universal source package
        run: node scripts/build-edition.mjs universal
      - uses: actions/upload-artifact@v7
        with:
          name: office-kit-universal
          path: dist/universal/*
          if-no-files-found: error
          retention-days: 14
